[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

# ===========================================================================
# METADADOS DO PROJETO
# ===========================================================================
[project]
name = "emupipeline"
version = "5.0.0"
description = "Pipeline modular para padronização e organização de bibliotecas de emulação"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EmuPipeline Contributors" }]
keywords = ["emulation", "retrogaming", "rom", "mame", "fbneo", "pipeline", "igir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]

# Dependências mínimas — intencionalmente pequenas
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
images     = ["Pillow>=10.0"]
kpi        = ["pandas>=2.0", "openpyxl>=3.1"]
validation = ["pydantic>=2.0"]
full       = ["emupipeline[images,kpi,validation]"]
dev        = [
    "emupipeline[full]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

# ===========================================================================
# ENTRY POINTS
# ===========================================================================
[project.scripts]
# pip install emupipeline  →  comando `emupipeline` disponível globalmente
emupipeline = "emupipeline.cli:main"

[project.entry-points."emupipeline.steps"]
# Plugins externos declaram seus steps aqui
# Exemplo: meu_step = "meu_pacote.meu_step:MeuStep"

# ===========================================================================
# HATCH BUILD — src-layout
# ===========================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/emupipeline"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "pyproject.toml", "README.md", "CHANGELOG.md", "config.yaml.example"]

# ===========================================================================
# RUFF — linter + formatter
# ===========================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","W","F","I","UP","B","SIM","TCH","C4","PTH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["emupipeline"]

[tool.ruff.format]
quote-style = "double"

# ===========================================================================
# MYPY — type checker
# ===========================================================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["tests/"]

# ===========================================================================
# PYTEST
# ===========================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src/emupipeline",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=75",
    "-v",
    "--tb=short",
]
markers = [
    "slow: testes que demoram > 1s",
    "integration: usam subprocess reais",
    "requires_ffmpeg: precisa de ffmpeg instalado",
    "requires_igir: precisa de igir instalado",
]

[tool.coverage.run]
source = ["src/emupipeline"]
omit = ["*/tests/*", "*/cli.py", "*/__init__.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
