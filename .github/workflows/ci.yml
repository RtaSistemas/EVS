name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"          # v1.0.0, v2.3.1-beta, etc.
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + Type check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy types-PyYAML pydantic pyyaml

      - name: Ruff — lint
        run: ruff check src/ tests/

      - name: Ruff — format check
        run: ruff format --check src/ tests/

      - name: Mypy — type check
        run: mypy src/emupipeline/

  # ---------------------------------------------------------------------------
  # Testes em múltiplas versões de Python
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          pip install -e ".[dev]"

      - name: Run tests (unit only — sem ferramentas externas)
        run: |
          pytest tests/unit/ \
            --cov=src/emupipeline \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Testes de integração (requer ferramentas no sistema)
  # ---------------------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Node.js + igir
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g igir

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -m "not requires_ffmpeg or requires_ffmpeg" \
            -v --tb=short

  # ---------------------------------------------------------------------------
  # Build do pacote Python (wheel + sdist)
  # ---------------------------------------------------------------------------
  build:
    name: Build Package (wheel + sdist)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate dist with twine
        run: twine check dist/*

      - name: Show dist contents
        run: ls -lh dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build do executável standalone (PyInstaller — Linux x86_64)
  # Incluído na release para usuários sem Python instalado (Steam Deck, etc.)
  # ---------------------------------------------------------------------------
  build-binary:
    name: Build Standalone Binary (Linux x86_64)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + PyInstaller
        run: |
          pip install -e ".[full]"
          pip install pyinstaller

      - name: Build standalone binary
        run: |
          pyinstaller \
            --onefile \
            --name emupipeline \
            --clean \
            --strip \
            --add-data "config.yaml.example:." \
            src/emupipeline/cli.py

      - name: Smoke-test the binary
        run: |
          ./dist/emupipeline --version
          echo "Binary OK — version printed above"

      - name: Compress binary
        run: |
          cd dist
          tar -czf emupipeline-linux-x86_64.tar.gz emupipeline
          sha256sum emupipeline-linux-x86_64.tar.gz > emupipeline-linux-x86_64.tar.gz.sha256
          ls -lh

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-x86_64
          path: |
            dist/emupipeline-linux-x86_64.tar.gz
            dist/emupipeline-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub Release — cria release e anexa TODOS os artefatos
  # Ativado apenas em tags v* (ex: git tag v5.1.0 && git push --tags)
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-binary, integration]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # obrigatório para criar releases e fazer upload de assets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo para gerar changelog

      - name: Download Python dist (wheel + sdist)
        uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: release-assets/

      - name: Download standalone binary
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-x86_64
          path: release-assets/

      - name: List all release assets
        run: |
          echo "=== Assets que serão incluídos na release ==="
          ls -lh release-assets/

      - name: Generate checksums para todos os assets
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "EmuPipeline ${{ steps.version.outputs.tag }}"
          generate_release_notes: true     # changelog automático via GitHub
          fail_on_unmatched_files: true    # falha se algum arquivo não for encontrado
          files: |
            release-assets/*.whl
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/SHA256SUMS.txt
          body: |
            ## EmuPipeline ${{ steps.version.outputs.tag }}

            ### Instalação

            **Via pip (recomendado):**
            ```bash
            pip install emupipeline==${{ steps.version.outputs.tag }}
            pip install emupipeline[tui]==${{ steps.version.outputs.tag }}   # com TUI
            pip install emupipeline[full]==${{ steps.version.outputs.tag }}  # tudo
            ```

            **Executável standalone Linux (sem Python necessário):**
            ```bash
            # Baixe emupipeline-linux-x86_64.tar.gz
            tar -xzf emupipeline-linux-x86_64.tar.gz
            chmod +x emupipeline
            ./emupipeline --version

            # Verificar integridade
            sha256sum -c SHA256SUMS.txt
            ```

            > Steam Deck: coloque o binário em `~/Applications/` e adicione ao Game Mode.

            ### Assets incluídos
            | Arquivo | Descrição |
            |---|---|
            | `*.whl` | Python wheel (pip install) |
            | `*.tar.gz` (sdist) | Source distribution |
            | `emupipeline-linux-x86_64.tar.gz` | Binário standalone Linux |
            | `SHA256SUMS.txt` | Checksums de todos os arquivos |

  # ---------------------------------------------------------------------------
  # Publish to PyPI (apenas em tags v* — depois do GitHub Release)
  # ---------------------------------------------------------------------------
  release-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi

    permissions:
      id-token: write   # OIDC para PyPI trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Usa OIDC (sem API token necessário quando configurado no PyPI)
